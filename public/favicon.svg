<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Brand Container for high contrast across dark and light browser tab bars -->
  <rect width="48" height="48" rx="10" fill="#141311" stroke="#B89A4A" stroke-width="1.5"/>
  
  <!-- Subtle Quantum Grid Lines -->
  <line x1="8" y1="14" x2="40" y2="14" stroke="#B89A4A" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="8" y1="24" x2="40" y2="24" stroke="#B89A4A" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="8" y1="34" x2="40" y2="34" stroke="#B89A4A" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- DNA-Quantum Helix Strand 1 (Gold) -->
  <path d="M 10 14 C 18 14, 22 34, 30 34 C 34 34, 38 24, 40 24" stroke="#B89A4A" stroke-width="2.75" stroke-linecap="round"/>
  
  <!-- DNA-Quantum Helix Strand 2 (Champagne) -->
  <path d="M 10 34 C 18 34, 22 14, 30 14 C 34 14, 38 24, 40 24" stroke="#E8D89A" stroke-width="2.25" stroke-linecap="round"/>

  <!-- Quantum Circuit Coupling Gates -->
  <line x1="20" y1="20" x2="20" y2="28" stroke="#B89A4A" stroke-width="2"/>
  <line x1="30" y1="14" x2="30" y2="34" stroke="#B89A4A" stroke-width="1.75"/>

  <!-- Qubit Nodes -->
  <circle cx="10" cy="14" r="3" fill="#B89A4A"/>
  <circle cx="10" cy="34" r="3" fill="#E8D89A"/>
  
  <circle cx="20" cy="24" r="2.5" fill="#E8D89A"/>
  
  <circle cx="30" cy="14" r="3.5" fill="#B89A4A" stroke="#141311" stroke-width="1.5"/>
  <circle cx="30" cy="34" r="3.5" fill="#E8D89A" stroke="#141311" stroke-width="1.5"/>
  
  <circle cx="40" cy="24" r="4" fill="#B89A4A"/>
  <circle cx="40" cy="24" r="1.5" fill="#FAF7F0"/>
</svg>